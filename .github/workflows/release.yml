name: Release

# Publishes to PyPI when a version tag is pushed:
#
#   git tag -a v0.4.1 -m "Release 0.4.1" && git push origin v0.4.1
#
# Authentication uses PyPI Trusted Publishing (OIDC) — there is no API token
# to store. This requires a one-time setup on PyPI, see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, do not publish"
        type: boolean
        default: true

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag  pyproject=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $declared"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        # The section "## [X.Y.Z] - date" of the version being built, up to
        # the next "## [" heading. Checked here, before anything is
        # published, so a release cannot go out without its notes.
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\n---\nFull history: [CHANGELOG.md](https://github.com/%s/blob/v%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$version" >> release-notes.md
          echo "Release notes for $version: $(wc -l < release-notes.md) lines"

      - name: Run the test suite
        run: |
          uv sync --extra dev --extra pandas
          uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Verify the sdist is self-sufficient
        # Everything needed to build and test must be inside the archive.
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/*/
          uv run --no-project --with pytest --with matplotlib --with click --with . \
            pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/p/pypedigree
    permissions:
      # Required for Trusted Publishing; mints a short-lived OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create the release with the built artifacts
        # The notes are the version's CHANGELOG.md section, extracted in the
        # build job.
        env:
          GH_TOKEN: ${{ github.token }}
        # A release candidate (v1.0.0rc1) is marked as a pre-release.
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "pypedigree ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md $prerelease
